
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BizTrack Kenya</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>BizTrack Kenya</h1>
        <p>Track your sales. Understand your business.</p>
    </header>

    <main>
        <section class="sales-section">
            <h2>Record a Sale</h2>

            <form id="sales-form">
                <label for="service-name">Service</label>
                <input
                    type="text"
                    id="service-name"
                    placeholder="e.g. Haircut, Beard Trim"
                    required
                >

                <label for="sale-amount">Amount (KSh)</label>
                <input
                    type="number"
                    id="sale-amount"
                    placeholder="e.g. 300"
                    min="1"
                    step="0.01"
                    required
                >

                <label for="payment-method">Payment Method</label>
                <select id="payment-method" required>
                    <option value="">Choose payment method</option>
                    <option value="M-Pesa">M-Pesa</option>
                    <option value="Cash">Cash</option>
                    <option value="Card">Card</option>
                    <option value="Other">Other</option>
                </select>

                <button type="submit">Add Sale</button>
            </form>
        </section>

        
<section class="business-summary">
    <h2>Business Summary</h2>
    <p>Total Sales: <strong id="total-sales">KSh 0.00</strong></p>
    <p>Number of Sales: <strong id="total-transactions">0</strong></p>
    <p>M-Pesa Sales: <strong id="mpesa-sales">KSh 0.00</strong></p>
</section>


<section class="daily-report">
    <h2>Daily Business Report</h2>

    <label for="report-date">Choose date</label>
    <input type="date" id="report-date">

    <div class="report-grid">
        <article class="report-card">
            <p>Total Sales</p>
            <h3 id="report-sales">KSh 0.00</h3>
        </article>

        <article class="report-card">
            <p>Number of Sales</p>
            <h3 id="report-count">0</h3>
        </article>

        <article class="report-card">
            <p>M-Pesa Sales</p>
            <h3 id="report-mpesa">KSh 0.00</h3>
        </article>
    </div>

    <button type="button" id="export-report">
        Export Sales to CSV
    </button>
</section>

        

        <section class="sales-history">
            <h2>Sales History</h2>
            <ul id="sales-list"></ul>
        </section>
    </main>

    <footer>
        <p>BizTrack Kenya &copy; 2026</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
